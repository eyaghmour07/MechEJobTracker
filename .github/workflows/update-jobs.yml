name: Update job listings

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      apply_url:
        description: "Paste a job posting URL to mark as applied. Leave blank to only refresh listings."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch jobs
        run: |
          if [ -n "${{ github.event.inputs.apply_url }}" ]; then
            python scripts/fetch_jobs.py --applied "${{ github.event.inputs.apply_url }}"
          else
            python scripts/fetch_jobs.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md NEW_GRAD_USA.md INTERN_INTL.md NEW_GRAD_INTL.md scripts/applied.yaml
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Update job listings"
            git push
          fi
